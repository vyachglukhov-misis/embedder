# Embedder: FastAPI + sentence-transformers + BAAI/bge-multilingual-gemma2.
# 9B параметров, ~18 ГБ VRAM в fp16, 3584-dim вектора, мультиязычный.
#
# Первый запуск (сборка образа + скачивание весов): ~15–20 минут.
# Последующие запуски (веса из ~/models-cache): ~1–2 минуты.
#
# Запуск: docker compose up -d --build
# Логи:   docker compose logs -f
# Стоп:   docker compose down

services:
  embedder:
    build: .
    container_name: emb-svc
    restart: unless-stopped

    # GPU-доступ. Требует nvidia-container-toolkit на хосте.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

    # Слушаем только loopback VM — наружу через SSH-туннель с Mac.
    ports:
      - "127.0.0.1:8000:8000"

    # Общий с reranker том под HF-кэш — веса не дублируются на диске.
    volumes:
      - ${HOME}/models-cache:/data

    # Healthcheck: Docker будет знать, что модель ещё грузится.
    # start_period=180s даёт время на загрузку 18 ГБ весов при первом старте.
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      retries: 5
      start_period: 180s
