# Embedder: FastAPI + sentence-transformers + BAAI/bge-multilingual-gemma2.
# Запускается на GPU 0. Реранкер на GPU 1.
#
# Запуск: docker compose up -d --build
# Логи:   docker compose logs -f
# Стоп:   docker compose down

services:
  embedder:
    build: .
    container_name: emb-svc
    restart: unless-stopped

    environment:
      # Явно направляем на GPU 0
      CUDA_VISIBLE_DEVICES: "0"
      PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

    ports:
      - "127.0.0.1:8000:8000"

    volumes:
      - ${HOME}/models-cache:/data

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      retries: 5
      start_period: 180s
